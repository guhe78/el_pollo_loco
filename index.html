<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="./assets/img/Sharkie/1.IDLE/1.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/components.css" />
    <link rel="stylesheet" href="./styles/responsive.css" />
    <title>Sharkie the Shark</title>
    <script src="./scripts/classes/world.class.js"></script>
    <script src="./scripts/classes/drawable-object.class.js"></script>
    <script src="./scripts/classes/status-bar.js"></script>
    <script src="./scripts/classes/life-bar.class.js"></script>
    <script src="./scripts/classes/endboss-life-bar.class.js"></script>
    <script src="./scripts/classes/coin-bar.class.js"></script>
    <script src="./scripts/classes/poison-bar.class.js"></script>
    <script src="./scripts/classes/movable-object.class.js"></script>
    <script src="./scripts/classes/throwable-object.class.js"></script>
    <script src="./scripts/classes/character-movement-controller.class.js"></script>
    <script src="./scripts/classes/character-combat-controller.class.js"></script>
    <script src="./scripts/classes/character.class.js"></script>
    <script src="./scripts/classes/enemy.class.js"></script>
    <script src="./scripts/classes/puffer-fish.class.js"></script>
    <script src="./scripts/classes/jelly-fish.class.js"></script>
    <script src="./scripts/classes/endboss-movement-controller.class.js"></script>
    <script src="./scripts/classes/endboss.class.js"></script>
    <script src="./scripts/classes/world-render-controller.class.js"></script>
    <script src="./scripts/classes/world-collision-controller.class.js"></script>
    <script src="./scripts/classes/world-endboss-intro-controller.class.js"></script>
    <script src="./scripts/classes/world-state-controller.class.js"></script>
    <script src="./scripts/classes/barrier.class.js"></script>
    <script src="./scripts/classes/background-object.class.js"></script>
    <script src="./scripts/classes/background-water.class.js"></script>
    <script src="./scripts/classes/coins.class.js"></script>
    <script src="./scripts/classes/poison.class.js"></script>
    <script src="./scripts/classes/keyboard.class.js"></script>
    <script src="./scripts/classes/level.class.js"></script>
    <script src="./scripts/classes/section.class.js"></script>
    <script src="./scripts/level/level1.js"></script>
    <script src="./scripts/ui/templates/menu-template.js"></script>
    <script src="./scripts/ui/overlay-states.js"></script>
    <script src="./scripts/ui/overlay-manager.js"></script>
    <script src="./scripts/game.js" defer></script>
    <script type="" src="script.js" defer></script>
  </head>
  <body onload="init()">
    <h1 class="main-headline text-kontur">
      <span>Sharkie</span><span> the </span><span>shark</span>
    </h1>
    <div id="game-container">
      <canvas id="canvas" width="720" height="480"></canvas>
      <div id="game-overlay" class="overlay"></div>
    </div>
    <div class="rotate-hint">Bitte das Gerät ins Querformat drehen.</div>
    <div
      id="mobile-controls"
      class="mobile-controls"
      aria-label="Mobile Steuerung"
    >
      <button
        id="mobile-pause-btn"
        class="mobile-btn mobile-btn-pause"
        aria-label="Pause"
      >
        ⏸
      </button>

      <div class="mobile-controls-left">
        <button
          id="mobile-throw-btn"
          class="mobile-btn mobile-btn-action"
          aria-label="Bubble"
        >
          B
        </button>
        <button
          id="mobile-slap-btn"
          class="mobile-btn mobile-btn-action"
          aria-label="Slap"
        >
          S
        </button>
      </div>

      <div class="mobile-controls-right">
        <button
          id="mobile-up-btn"
          class="mobile-btn mobile-btn-dir"
          aria-label="Oben"
        >
          ↑
        </button>
        <div class="mobile-controls-right-row">
          <button
            id="mobile-left-btn"
            class="mobile-btn mobile-btn-dir"
            aria-label="Links"
          >
            ←
          </button>
          <button
            id="mobile-down-btn"
            class="mobile-btn mobile-btn-dir"
            aria-label="Unten"
          >
            ↓
          </button>
          <button
            id="mobile-right-btn"
            class="mobile-btn mobile-btn-dir"
            aria-label="Rechts"
          >
            →
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
